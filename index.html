<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>دستیار هوش مصنوعی من</title>
  <meta name="description" content="با دستیار هوش مصنوعی من چت کن.">
  <meta name="theme-color" content="#0C1826">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233FD0C0' stroke-width='1.8' stroke-linejoin='round'%3E%3Crect x='5' y='5' width='14' height='14' rx='1.5'/%3E%3Crect x='5' y='5' width='14' height='14' rx='1.5' transform='rotate(45 12 12)'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">

  <script>
    // تم را قبل از اولین رندر تنظیم کن تا صفحه چشمک نزند
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #F3F7F7;
      --surface: #FFFFFF;
      --surface-2: #E8F0F0;
      --line: #D2DFE0;
      --text: #0F2233;
      --muted: #566F82;
      --accent: #0B7E76;
      --accent-ink: #FFFFFF;
      --accent-soft: #D6F0EC;
      --saffron: #D9950F;
      --danger: #B3372F;
      --danger-soft: #FBE9E7;
      --code-bg: #0F2233;
      --code-text: #E4EEF2;
      --shadow: 0 1px 2px rgba(15, 34, 51, .06), 0 8px 24px -12px rgba(15, 34, 51, .18);
      --font: 'Vazirmatn', Tahoma, system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #0C1826;
      --surface: #13263A;
      --surface-2: #1A3350;
      --line: #25415D;
      --text: #E8F1F3;
      --muted: #8CA5B8;
      --accent: #3FD0C0;
      --accent-ink: #04211F;
      --accent-soft: #123B3D;
      --saffron: #F2B84B;
      --danger: #FF8F86;
      --danger-soft: #3A1F24;
      --code-bg: #08121D;
      --code-text: #DCE9EF;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -14px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 15.5px;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button, textarea { font: inherit; color: inherit; }

    button { cursor: pointer; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    [hidden] { display: none !important; }

    svg.icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- چیدمان کلی ---------- */
    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .col {
      width: min(760px, calc(100% - 32px));
      margin-inline: auto;
    }

    /* ---------- نوار بالا ---------- */
    .topbar {
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .topbar .col {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-inline-end: auto;
    }

    .brand-tile {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
    }

    .brand-tile svg { width: 22px; height: 22px; }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      font-size: 14px;
      transition: background-color .15s, border-color .15s;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-2);
    }

    .btn-ghost:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-ghost.icon-only {
      width: 38px;
      padding: 0;
      justify-content: center;
    }

    .theme-sun { display: none; }
    :root[data-theme="dark"] .theme-sun { display: block; }
    :root[data-theme="dark"] .theme-moon { display: none; }

    /* ---------- ناحیه‌ی گفتگو ---------- */
    .thread {
      overflow-y: auto;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .thread::-webkit-scrollbar { width: 8px; }
    .thread::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

    /* ---------- صفحه‌ی خوش‌آمدگویی ---------- */
    .hero {
      position: relative;
      padding: clamp(28px, 9vh, 88px) 0 24px;
      text-align: center;
    }

    .hero-pattern {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--accent);
      opacity: .22;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 30%, #000 10%, transparent 75%);
      mask-image: radial-gradient(ellipse 60% 55% at 50% 30%, #000 10%, transparent 75%);
    }

    .hero-inner { position: relative; }

    .hero-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: block;
      color: var(--accent);
    }

    /* رنگ نقطه‌ی مرکز ستاره (متغیر CSS به داخل <use> ارث می‌رسد) */
    .hero-mark, .msg.assistant .mark { --dot: var(--saffron); }

    .hero h2 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 800;
      line-height: 1.5;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 2;
    }

    .suggestions {
      list-style: none;
      margin: 32px auto 0;
      padding: 0;
      max-width: 520px;
      text-align: start;
      border-top: 1px solid var(--line);
      position: relative;
    }

    .suggestions li { border-bottom: 1px solid var(--line); }

    .suggestion {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 4px;
      border: 0;
      background: transparent;
      text-align: start;
      font-size: 15px;
      transition: color .15s, padding .15s;
    }

    .suggestion svg { color: var(--muted); transition: color .15s; }

    .suggestion:hover { color: var(--accent); padding-inline-start: 10px; }
    .suggestion:hover svg { color: var(--accent); }

    /* ---------- پیام‌ها ---------- */
    #messages { padding: 22px 0 28px; }

    .msg {
      display: flex;
      gap: 12px;
      margin-bottom: 26px;
    }

    .msg.user { justify-content: flex-start; }

    .bubble {
      max-width: min(80%, 560px);
      padding: 10px 16px;
      border-radius: 18px 18px 18px 5px;
      background: var(--accent);
      color: var(--accent-ink);
      line-height: 1.95;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.assistant .mark {
      width: 30px;
      height: 30px;
      margin-top: 2px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .msg.assistant .mark svg { width: 20px; height: 20px; }

    .msg.thinking .mark svg { animation: spin 2.4s linear infinite; }

    .body { min-width: 0; flex: 1; }

    .tools { margin-top: 6px; display: flex; gap: 4px; }

    .tool {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      transition: background-color .15s, color .15s;
    }

    .tool:hover { background: var(--surface-2); color: var(--text); }
    .tool svg { width: 15px; height: 15px; }

    .status {
      color: var(--muted);
      line-height: 2;
    }

    .status .dots span {
      display: inline-block;
      animation: blink 1.2s infinite both;
    }
    .status .dots span:nth-child(2) { animation-delay: .2s; }
    .status .dots span:nth-child(3) { animation-delay: .4s; }

    .error {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--danger-soft);
      color: var(--danger);
      line-height: 1.9;
    }

    .error .btn-ghost {
      height: 32px;
      border-color: currentColor;
      font-size: 13px;
    }

    /* ---------- متنِ پاسخ (مارکداون) ---------- */
    .prose { line-height: 2; overflow-wrap: anywhere; }

    .prose > :first-child { margin-top: 0; }
    .prose > :last-child { margin-bottom: 0; }

    .prose p { margin: 0 0 .8em; }

    .prose h1, .prose h2, .prose h3, .prose h4 {
      margin: 1.3em 0 .4em;
      line-height: 1.6;
      font-weight: 700;
    }
    .prose h1 { font-size: 1.35em; }
    .prose h2 { font-size: 1.22em; }
    .prose h3 { font-size: 1.1em; }
    .prose h4 { font-size: 1em; }

    .prose ul, .prose ol { margin: 0 0 .8em; padding-inline-start: 1.5em; }
    .prose li { margin-bottom: .2em; }
    .prose li::marker { color: var(--accent); }

    .prose blockquote {
      margin: 0 0 .8em;
      padding: 2px 14px;
      border-inline-start: 3px solid var(--accent);
      color: var(--muted);
    }

    .prose hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }

    .prose a {
      color: var(--accent);
      text-decoration-color: var(--saffron);
      text-underline-offset: 3px;
    }

    .prose strong { font-weight: 700; }

    .prose code {
      font-family: var(--mono);
      font-size: .86em;
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--surface-2);
      direction: ltr;
      unicode-bidi: isolate;
    }

    .codeblock {
      margin: 0 0 .9em;
      border-radius: 12px;
      overflow: hidden;
      background: var(--code-bg);
      direction: ltr;
      text-align: left;
    }

    .codeblock header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 4px 14px;
      color: #93A9B8;
      font-family: var(--mono);
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .codeblock header .tool { color: #93A9B8; }
    .codeblock header .tool:hover { background: rgba(255, 255, 255, .08); color: #fff; }

    .codeblock pre { margin: 0; padding: 14px; overflow-x: auto; }

    .prose .codeblock pre code {
      padding: 0;
      background: none;
      color: var(--code-text);
      font-size: 13.5px;
      line-height: 1.75;
      unicode-bidi: normal;
    }

    .table-wrap { overflow-x: auto; margin: 0 0 .9em; }

    .prose table { border-collapse: collapse; min-width: 100%; font-size: .94em; }

    .prose th, .prose td {
      padding: 8px 12px;
      border: 1px solid var(--line);
      text-align: start;
    }

    .prose th { background: var(--surface-2); font-weight: 700; }

    /* ---------- ورودی پیام ---------- */
    .composer {
      padding: 10px 0 calc(14px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
    }

    .field {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color .15s;
    }

    .field:focus-within { border-color: var(--accent); }

    .field textarea {
      flex: 1;
      min-height: 40px;
      max-height: 200px;
      padding: 8px 10px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      line-height: 1.9;
    }

    .field textarea::placeholder { color: var(--muted); }

    .send {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .15s;
    }

    .send:hover:not(:disabled) { transform: translateY(-1px); }
    .send:disabled { opacity: .35; cursor: not-allowed; }

    .hint {
      margin: 8px 6px 0;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .hint { display: none; }
      .topbar .btn-ghost .label { display: none; }
      .topbar .btn-ghost { width: 38px; padding: 0; justify-content: center; }
      .bubble { max-width: 88%; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <!-- نشان ستاره‌ی هشت‌پر (دو مربع روی هم) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <rect x="5" y="5" width="14" height="14" rx="1.5"/>
        <rect x="5" y="5" width="14" height="14" rx="1.5" transform="rotate(45 12 12)"/>
      </g>
      <circle cx="12" cy="12" r="1.7" style="fill: var(--dot, currentColor)"/>
    </symbol>
  </svg>

  <div class="app">

    <header class="topbar">
      <div class="col">
        <div class="brand">
          <div class="brand-tile"><svg aria-hidden="true"><use href="#star"/></svg></div>
          <h1>دستیار من</h1>
        </div>

        <button class="btn-ghost" id="new-chat" type="button" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="label">چت جدید</span>
        </button>

        <button class="btn-ghost icon-only" id="theme" type="button" aria-label="تغییر تم روشن و تیره">
          <svg class="icon theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="icon theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite">
      <div class="col">

        <section class="hero" id="hero">
          <svg class="hero-pattern" aria-hidden="true">
            <defs>
              <pattern id="tile" width="56" height="56" patternUnits="userSpaceOnUse">
                <g fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
                  <rect x="14" y="14" width="28" height="28" rx="2"/>
                  <rect x="14" y="14" width="28" height="28" rx="2" transform="rotate(45 28 28)"/>
                </g>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#tile)"/>
          </svg>

          <div class="hero-inner">
            <svg class="hero-mark" aria-hidden="true"><use href="#star"/></svg>
            <h2>سلام! چه کمکی از دستم برمیاد؟</h2>
            <p>هر چیزی که می‌خوای بپرس؛ فارسی یا هر زبان دیگه.</p>

            <ul class="suggestions">
              <li><button class="suggestion" type="button"><span>خودت رو معرفی کن</span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></li>
              <li><button class="suggestion" type="button"><span>یه تمرین ساده برای یاد گرفتن انگلیسی پیشنهاد بده</span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></li>
              <li><button class="suggestion" type="button"><span>تفاوت وب‌هوک و پولینگ در ربات تلگرام رو ساده توضیح بده</span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></li>
              <li><button class="suggestion" type="button"><span>یه ایده برای پروژه‌ی آخر هفته بده</span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></li>
            </ul>
          </div>
        </section>

        <div id="messages"></div>
      </div>
    </main>

    <footer class="composer">
      <div class="col">
        <div class="field">
          <textarea id="input" rows="1" placeholder="پیامت را بنویس..." aria-label="پیام" maxlength="4000"></textarea>
          <button class="send" id="send" type="button" aria-label="ارسال پیام" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="hint">Enter پیام را می‌فرستد و Shift+Enter خط جدید می‌سازد.</p>
      </div>
    </footer>

  </div>

  <script>
    const STORE_KEY = "assistant-chat-v1";
    const MAX_CONTEXT = 20;

    const thread = document.getElementById("thread");
    const hero = document.getElementById("hero");
    const list = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newBtn = document.getElementById("new-chat");
    const themeBtn = document.getElementById("theme");

    let history = loadHistory();
    let busy = false;

    const ICON_COPY = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
    const ICON_CHECK = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const ICON_RETRY = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>';
    const MARK = '<div class="mark"><svg aria-hidden="true"><use href="#star"/></svg></div>';

    /* ---------- ذخیره‌سازی ---------- */
    function loadHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY));
        if (Array.isArray(saved)) {
          return saved.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string");
        }
      } catch (e) {}
      return [];
    }

    function saveHistory() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(history.slice(-60))); } catch (e) {}
    }

    /* ---------- تم ---------- */
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      document.querySelector('meta[name="theme-color"]').content = next === "dark" ? "#0C1826" : "#F3F7F7";
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    /* ---------- رندر مارکداون (امن: اول HTML خنثی می‌شود) ---------- */
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function inline(raw) {
      const codes = [];
      let s = escapeHtml(raw).replace(/`([^`\n]+)`/g, (_, c) => `\u0001${codes.push(c) - 1}\u0001`);

      s = s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/__(.+?)__/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^\s*](?:[^*\n]*[^\s*])?)\*(?=$|[\s).,،؛:!?؟])/g, "$1<em>$2</em>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

      return s.replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${codes[i]}</code>`);
    }

    function renderTable(rows) {
      const cells = line => line.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      return '<div class="table-wrap"><table dir="auto"><thead><tr>' +
        head.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>";
    }

    function renderMarkdown(source) {
      const blocks = [];
      const text = source.replace(/```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(```|$)/g, (_, lang, code) => {
        blocks.push({ lang, code: code.replace(/\n$/, "") });
        return `\n\u0002${blocks.length - 1}\u0002\n`;
      });

      const lines = text.split("\n");
      const LIST_ITEM = /^\s*([-*•]|\d+[.)])\s+/;
      let html = "";
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];
        let m;

        if (!line.trim()) { i++; continue; }

        if ((m = line.trim().match(/^\u0002(\d+)\u0002$/))) {
          const { lang, code } = blocks[Number(m[1])];
          html += `<div class="codeblock"><header><span>${escapeHtml(lang || "code")}</span>` +
            `<button class="tool" type="button" data-copy-code>${ICON_COPY}<span>کپی</span></button></header>` +
            `<pre><code>${escapeHtml(code)}</code></pre></div>`;
          i++;
        } else if ((m = line.match(/^(#{1,4})\s+(.+)$/))) {
          html += `<h${m[1].length} dir="auto">${inline(m[2])}</h${m[1].length}>`;
          i++;
        } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
          html += "<hr>";
          i++;
        } else if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
          const rows = [];
          while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
          html += renderTable(rows);
        } else if (/^\s*>\s?/.test(line)) {
          const quote = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ""));
          html += `<blockquote dir="auto">${quote.map(inline).join("<br>")}</blockquote>`;
        } else if (LIST_ITEM.test(line)) {
          const ordered = /^\s*\d+[.)]/.test(line);
          const items = [];
          while (i < lines.length && LIST_ITEM.test(lines[i])) {
            items.push(lines[i++].replace(LIST_ITEM, ""));
          }
          const tag = ordered ? "ol" : "ul";
          html += `<${tag} dir="auto">${items.map(t => `<li>${inline(t)}</li>`).join("")}</${tag}>`;
        } else {
          const para = [];
          while (i < lines.length && lines[i].trim() &&
                 !/^(#{1,4}\s|\s*>|\s*\|.*\|\s*$|\u0002)/.test(lines[i].trim()) &&
                 !LIST_ITEM.test(lines[i])) {
            para.push(lines[i++]);
          }
          if (!para.length) para.push(lines[i++]);
          html += `<p dir="auto">${para.map(inline).join("<br>")}</p>`;
        }
      }
      return html;
    }

    /* ---------- کپی ---------- */
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); } catch (err) {}
        area.remove();
      }
    }

    function flashCopied(button) {
      const original = button.innerHTML;
      button.innerHTML = `${ICON_CHECK}<span>کپی شد</span>`;
      setTimeout(() => { button.innerHTML = original; }, 1600);
    }

    list.addEventListener("click", async (event) => {
      const codeBtn = event.target.closest("[data-copy-code]");
      if (!codeBtn) return;
      await copyText(codeBtn.closest(".codeblock").querySelector("code").textContent);
      flashCopied(codeBtn);
    });

    /* ---------- ساخت ردیف‌های پیام ---------- */
    function scrollToEnd() {
      thread.scrollTop = thread.scrollHeight;
    }

    function addUser(text) {
      const row = document.createElement("article");
      row.className = "msg user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.dir = "auto";
      bubble.textContent = text;
      row.appendChild(bubble);
      list.appendChild(row);
      return row;
    }

    function addAssistant(text) {
      const row = document.createElement("article");
      row.className = "msg assistant";
      row.innerHTML = MARK + '<div class="body"><div class="prose"></div>' +
        `<div class="tools"><button class="tool" type="button">${ICON_COPY}<span>کپی</span></button></div></div>`;
      row.querySelector(".prose").innerHTML = renderMarkdown(text);
      const copyBtn = row.querySelector(".tools .tool");
      copyBtn.addEventListener("click", async () => { await copyText(text); flashCopied(copyBtn); });
      list.appendChild(row);
      return row;
    }

    function addThinking() {
      const row = document.createElement("article");
      row.className = "msg assistant thinking";
      row.innerHTML = MARK + '<div class="body"><div class="status">در حال نوشتن<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div>';
      list.appendChild(row);
      return row;
    }

    function showError(row, message) {
      row.classList.remove("thinking");
      row.querySelector(".body").innerHTML =
        `<div class="error" role="alert"><span></span><button class="btn-ghost" type="button">${ICON_RETRY}<span>تلاش دوباره</span></button></div>`;
      row.querySelector(".error span").textContent = message;
      row.querySelector(".error button").addEventListener("click", () => {
        row.remove();
        requestReply();
      });
    }

    /* ---------- وضعیت صفحه ---------- */
    function syncUI() {
      const empty = history.length === 0 && !list.children.length;
      hero.hidden = !empty;
      newBtn.disabled = empty || busy;
      sendBtn.disabled = busy || !input.value.trim();
    }

    function render() {
      list.innerHTML = "";
      for (const m of history) {
        if (m.role === "user") addUser(m.content);
        else addAssistant(m.content);
      }
      syncUI();
      scrollToEnd();
    }

    /* ---------- ارسال و دریافت ---------- */
    async function requestReply() {
      busy = true;
      syncUI();

      const row = addThinking();
      scrollToEnd();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-MAX_CONTEXT) })
        });

        let data = {};
        try { data = await response.json(); } catch (e) {}

        if (!response.ok) {
          throw new Error(typeof data.error === "string" ? data.error : "پاسخی از سرور نیامد. دوباره امتحان کن.");
        }

        const answer = data.answer || "پاسخی دریافت نشد.";
        history.push({ role: "assistant", content: answer });
        saveHistory();
        row.replaceWith(addAssistant(answer));
      } catch (error) {
        const offline = error instanceof TypeError;
        showError(row, offline ? "اتصال به اینترنت برقرار نیست. اتصالت را بررسی کن و دوباره امتحان کن." : error.message);
      } finally {
        busy = false;
        syncUI();
        scrollToEnd();
        input.focus();
      }
    }

    function sendMessage(text) {
      text = (text ?? input.value).trim();
      if (!text || busy) return;

      history.push({ role: "user", content: text });
      saveHistory();
      addUser(text);

      input.value = "";
      autosize();
      requestReply();
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 200) + "px";
      syncUI();
    }

    /* ---------- رویدادها ---------- */
    input.addEventListener("input", autosize);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", () => sendMessage());

    newBtn.addEventListener("click", () => {
      history = [];
      saveHistory();
      render();
      input.focus();
    });

    document.querySelectorAll(".suggestion").forEach(btn => {
      btn.addEventListener("click", () => sendMessage(btn.querySelector("span").textContent));
    });

    render();
    input.focus();
  </script>
</body>
</html>
